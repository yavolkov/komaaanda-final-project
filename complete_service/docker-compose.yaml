services:
  predictor:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-camera-predictor:latest
    container_name: smart_camera_predictor
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/artifacts:ro
    environment:
      - ARTIFACTS_DIR=/artifacts
      - IMAGES_DIR=/artifacts/listing_images
      - HF_HOME=/root/.cache/huggingface
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
